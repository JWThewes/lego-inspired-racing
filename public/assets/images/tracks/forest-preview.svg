<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="200" fill="#87CEEB"/>

  <!-- Forest ground -->
  <rect y="200" width="400" height="100" fill="#2d5a2d"/>

  <!-- Trees -->
  <g id="tree1">
    <rect x="40" y="120" width="15" height="80" fill="#4a3728"/>
    <polygon points="47.5,80 30,130 65,130" fill="#2d5a2d"/>
    <polygon points="47.5,100 35,140 60,140" fill="#3a6a3a"/>
  </g>
  <g id="tree2">
    <rect x="120" y="140" width="15" height="60" fill="#4a3728"/>
    <polygon points="127.5,110 110,150 145,150" fill="#2d5a2d"/>
    <polygon points="127.5,125 115,160 140,160" fill="#3a6a3a"/>
  </g>
  <g id="tree3">
    <rect x="320" y="130" width="15" height="70" fill="#4a3728"/>
    <polygon points="327.5,95 310,140 345,140" fill="#2d5a2d"/>
    <polygon points="327.5,110 315,150 340,150" fill="#3a6a3a"/>
  </g>
  <g id="tree4">
    <rect x="360" y="150" width="15" height="50" fill="#4a3728"/>
    <polygon points="367.5,125 350,160 385,160" fill="#2d5a2d"/>
    <polygon points="367.5,135 355,170 380,170" fill="#3a6a3a"/>
  </g>

  <!-- Winding path -->
  <path d="M 50 260 Q 100 230 150 250 Q 200 270 250 245 Q 300 220 350 250"
        fill="none" stroke="#4a3520" stroke-width="30"/>
  <path d="M 50 260 Q 100 230 150 250 Q 200 270 250 245 Q 300 220 350 250"
        fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="10,10"/>

  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#FFD700" text-anchor="middle">FOREST TRAIL</text>
</svg>
