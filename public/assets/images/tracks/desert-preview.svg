<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sky -->
  <rect width="400" height="200" fill="#87CEEB"/>

  <!-- Desert ground -->
  <rect y="200" width="400" height="100" fill="#d4a76a"/>

  <!-- Dunes -->
  <ellipse cx="100" cy="220" rx="80" ry="40" fill="#c49a5a"/>
  <ellipse cx="300" cy="230" rx="100" ry="50" fill="#b48a4a"/>
  <ellipse cx="200" cy="240" rx="60" ry="30" fill="#c49a5a"/>

  <!-- Sun -->
  <circle cx="350" cy="50" r="30" fill="#FFD700"/>

  <!-- Track -->
  <path d="M 50 250 Q 150 220 200 240 T 350 250"
        fill="none" stroke="#8b7355" stroke-width="35"/>
  <path d="M 50 250 Q 150 220 200 240 T 350 250"
        fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="10,10"/>

  <!-- Title -->
  <text x="200" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold"
        fill="#FFD700" text-anchor="middle">DESERT DUNES</text>
</svg>
